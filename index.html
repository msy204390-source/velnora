<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELNORA | The World's AI-Powered Business Ecosystem</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }
        .logo span {
            color: var(--accent-color);
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            max-width: 800px;
            line-height: 1.2;
        }
        h1 span {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .hub-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: var(--accent-color);
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        #result-area {
            margin-top: 20px;
            text-align: right;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }
        @media(max-width: 768px) {
            h1 { font-size: 2rem; }
            header { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">VELNORA<span>.</span></div>
        <div style="font-size: 0.9rem; color: var(--text-muted);">Global Intelligence Ecosystem</div>
    </header>

    <main>
        <h1>منظومة أعمالك الذكية <span>في مكان واحد</span></h1>
        <p class="subtitle">اكتب فكرة مشروعك أو هدفك الرقمي، وسيقوم مركز VELNORA الذكي بتحليل المتطلبات وتخطيط مسار العمل المتكامل لك.</p>

        <div class="hub-box">
            <textarea id="user-goal" placeholder="مثال: أريد إطلاق متجر إلكتروني لبيع منتجات العناية بالبشرة..."></textarea>
            <button onclick="analyzeGoal()">تحليل وتخطيط المشروع ⚡</button>
            
            <div id="result-area">
                <strong>جاري تحليل المشروع عبر منظومة VELNORA...</strong><br>
                <span id="output-text"></span>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 VELNORA Inc. All rights reserved.
    </footer>

    <script>
        function analyzeGoal() {
            const goal = document.getElementById('user-goal').value.trim();
            const resultArea = document.getElementById('result-area');
            const outputText = document.getElementById('output-text');

            if (!goal) {
                alert('الرجاء إدخال فكرة أو هدف المشروع أولاً!');
                return;
            }

            resultArea.style.display = 'block';
            outputText.innerHTML = 'جاري معالجة المتطلبات عبر أقسام الذكاء الاصطناعي والتسويق والأتمتة...';

            setTimeout(() => {
                outputText.innerHTML = `
                    ✅ <strong>تم إنشاء مسار العمل بنجاح لمشروعك:</strong><br>
                    1. <strong>الاستراتيجية والسوق:</strong> تم تحديد الجمهور المستهدف وتحليل أولي للمنافسين.<br>
                    2. <strong>الهوية البصرية:</strong> المقترح جاهز للتصميم وتحديد الألوان.<br>
                    3. <strong>المنصة الرقمية:</strong> جاهزة للتطوير والربط عبر قسم التجارة الإلكترونية.<br>
                    4. <strong>التسويق والأتمتة:</strong> تم إعداد خطة الحملات الأولية وأتمتة خدمة العملاء.<br>
                    <em>(هذه مجرد معاينة تجريبية للنواة الأولى - سيتم ربطها بنظام الذكاء الاصطناعي الكامل قريباً).</em>
                `;
            }, 1500);
        }
    </script>

</body>
</html>
